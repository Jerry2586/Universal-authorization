name: appgog
services:
  appgog:
    image: ${APPGOG_IMAGE:-appgog-platform:local}
    build:
      context: .
      args:
        NODE_IMAGE: ${APPGOG_NODE_IMAGE:-node:24-bookworm-slim}
        CADDY_IMAGE: ${APPGOG_CADDY_IMAGE:-caddy:2.10}
    pull_policy: never
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 2g
    cpus: "2.0"
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=268435456,mode=1777
    env_file:
      - path: .env
        required: false
    environment:
      APPGOG_DEPLOYMENT_ROLE: build
      APPGOG_BUSINESS_PAIRED: ${APPGOG_BUSINESS_PAIRED:-false}
      AUTH_DOMAIN: ${AUTH_DOMAIN:-}
      BUILD_DOMAIN: ${BUILD_DOMAIN:-}
      LICENSE_SERVICE_ENABLED: false
      CUSTOMER_LOGIN_ENABLED: false
      BUILD_CENTER_ENABLED: false
      NEW_BUILDS_ENABLED: false
      WORKER_ENABLED: false
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
      - "${HTTPS_PORT:-443}:8443/udp"
    volumes:
      - appgog-artifacts:/app/var/artifacts
      - ${APPGOG_SHARED_DIR:-./shared}/update-control:/app/var/update-control
      - appgog-build-config:/app/runtime/build
      - appgog-worker-config:/app/runtime/worker
      - appgog-caddy-data:/app/runtime/caddy-data
      - appgog-caddy-config:/app/runtime/caddy-config
    healthcheck:
      test: ["CMD", "node", "scripts/docker/health.js"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
volumes:
  appgog-artifacts:
  appgog-build-config:
  appgog-worker-config:
  appgog-caddy-data:
  appgog-caddy-config:
