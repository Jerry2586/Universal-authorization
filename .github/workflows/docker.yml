name: Docker deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit and integration tests
        run: npm test
      - name: Fresh install, real build, update and complete restore
        run: sh scripts/docker/verify.sh
      - name: Service diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=100 initialize license-center build-center build-worker
