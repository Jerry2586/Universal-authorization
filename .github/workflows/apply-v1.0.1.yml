name: Apply verified v1.0.1 source sync

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v1.0.1.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the locally verified source patch
        shell: bash
        run: |
          git show HEAD^:.github/workflows/apply-v1.0.1.yml |
            awk '
              /^[[:space:]]+H4s/ { capture = 1 }
              capture {
                line = $0
                sub(/^[[:space:]]+/, "", line)
                if (line == "PATCH_B64") exit
                print line
              }
            ' > "$RUNNER_TEMP/release.patch.b64"
          test -s "$RUNNER_TEMP/release.patch.b64"
          base64 --decode "$RUNNER_TEMP/release.patch.b64" | gzip --decompress > "$RUNNER_TEMP/release.patch"
          git apply --index --exclude='.github/workflows/docker.yml' --exclude='package.json' "$RUNNER_TEMP/release.patch"
          git rm -- 'APPGOG打包授权系统_v1.0.0_需求交接说明.txt'
          git config user.name Jerry2586
          git config user.email Jerry2586@users.noreply.github.com
          git commit -m 'release: synchronize APPGOG v1.0.1 source'
          git push origin HEAD:main
