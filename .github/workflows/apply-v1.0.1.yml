name: Apply verified v1.0.1 release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v1.0.1.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the locally verified release patch
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release.patch.b64" <<'PATCH_B64'
          
          PATCH_B64
          base64 --decode "$RUNNER_TEMP/release.patch.b64" | gzip --decompress > "$RUNNER_TEMP/release.patch"
          git apply --index "$RUNNER_TEMP/release.patch"
          git rm -- 'APPGOG打包授权系统_v1.0.0_需求交接说明.txt'
          git rm -- '.github/workflows/apply-v1.0.1.yml'
          git config user.name Jerry2586
          git config user.email Jerry2586@users.noreply.github.com
          git commit -m 'release: publish APPGOG v1.0.1'
          git push origin HEAD:main
