name: appgog
services:
  appgog:
    image: ${APPGOG_IMAGE:-appgog-platform:local}
    build:
      context: .
      args:
        NODE_IMAGE: ${APPGOG_NODE_IMAGE:-node:24-bookworm-slim}
        CADDY_IMAGE: ${APPGOG_CADDY_IMAGE:-caddy:2.10}
    pull_policy: never
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 2g
    cpus: "2.0"
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=268435456,mode=1777
    env_file:
      - path: .env
        required: false
    environment:
      AUTH_DOMAIN: ${AUTH_DOMAIN:-}
      BUILD_DOMAIN: ${BUILD_DOMAIN:-}
      LICENSE_SERVICE_ENABLED: ${LICENSE_SERVICE_ENABLED:-true}
      CUSTOMER_LOGIN_ENABLED: ${CUSTOMER_LOGIN_ENABLED:-true}
      BUILD_CENTER_ENABLED: ${BUILD_CENTER_ENABLED:-true}
      NEW_BUILDS_ENABLED: ${NEW_BUILDS_ENABLED:-true}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
      - "${HTTPS_PORT:-443}:8443/udp"
    volumes:
      - appgog-db:/app/var/data
      - appgog-keys:/app/var/keys
      - appgog-artifacts:/app/var/artifacts
      - appgog-uploads:/app/var/uploads
      - ${APPGOG_SHARED_DIR:-./shared}/update-control:/app/var/update-control
      - appgog-license-config:/app/runtime/license
      - appgog-build-config:/app/runtime/build
      - appgog-worker-config:/app/runtime/worker
      - appgog-caddy-data:/app/runtime/caddy-data
      - appgog-caddy-config:/app/runtime/caddy-config
    healthcheck:
      test: ["CMD", "node", "scripts/docker/health.js"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
volumes:
  appgog-db:
  appgog-keys:
  appgog-artifacts:
  appgog-uploads:
  appgog-license-config:
  appgog-build-config:
  appgog-worker-config:
  appgog-caddy-data:
  appgog-caddy-config:
