name: appgog

services:
  license-center:
    build: .
    image: appgog-platform:local
    command: ["node", "apps/license-api/src/server.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8787
      APPGOG_SURFACE: license-center
      EMBEDDED_WORKER: "false"
      DATABASE_PATH: /app/var/data/appgog.sqlite
      SIGNING_PRIVATE_KEY_PATH: /app/var/keys/ed25519-private.pem
      SIGNING_PUBLIC_KEY_PATH: /app/var/keys/ed25519-public.pem
      ARTIFACT_ROOT: /app/var/artifacts
      UPLOAD_ROOT: /app/var/uploads
      KEY_HASH_PEPPER: ${KEY_HASH_PEPPER:?请在 .env 设置 KEY_HASH_PEPPER}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?请在 .env 设置 ADMIN_TOKEN}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 设置 ADMIN_PASSWORD}
      WORKER_TOKEN: ${WORKER_TOKEN:?请在 .env 设置 WORKER_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 设置 SESSION_SECRET}
      DELIVERY_ENCRYPTION_KEY: ${DELIVERY_ENCRYPTION_KEY:?请在 .env 设置 DELIVERY_ENCRYPTION_KEY}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?请在 .env 设置 INTERNAL_SERVICE_TOKEN}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8787}
      BUILD_CENTER_PUBLIC_URL: ${BUILD_CENTER_PUBLIC_URL:-http://127.0.0.1:8788/build}
      ACTIVATION_TOKEN_TTL_SECONDS: ${ACTIVATION_TOKEN_TTL_SECONDS:-604800}
      OFFLINE_GRACE_SECONDS: ${OFFLINE_GRACE_SECONDS:-2592000}
      BUILD_TICKET_TTL_SECONDS: ${BUILD_TICKET_TTL_SECONDS:-900}
      WEB_SESSION_TTL_SECONDS: ${WEB_SESSION_TTL_SECONDS:-28800}
      MAX_SOURCE_UPLOAD_BYTES: ${MAX_SOURCE_UPLOAD_BYTES:-134217728}
    ports:
      - "${LICENSE_PORT:-8787}:8787"
    volumes:
      - appgog-db:/app/var/data
      - appgog-keys:/app/var/keys
      - appgog-artifacts:/app/var/artifacts
      - appgog-uploads:/app/var/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  build-center:
    image: appgog-platform:local
    command: ["node", "apps/build-center/src/server.js"]
    restart: unless-stopped
    depends_on:
      license-center:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      BUILD_CENTER_PORT: 8788
      INTERNAL_LICENSE_URL: http://license-center:8787
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?请在 .env 设置 INTERNAL_SERVICE_TOKEN}
    ports:
      - "${BUILD_PORT:-8788}:8788"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  build-worker:
    image: appgog-platform:local
    command: ["node", "apps/build-worker/src/server.js"]
    restart: unless-stopped
    depends_on:
      license-center:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      INTERNAL_LICENSE_URL: http://license-center:8787
      WORKER_TOKEN: ${WORKER_TOKEN:?请在 .env 设置 WORKER_TOKEN}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8787}
      ARTIFACT_ROOT: /app/var/artifacts
      WORKER_ID: ${WORKER_ID:-worker-compose-1}
    volumes:
      - appgog-artifacts:/app/var/artifacts

volumes:
  appgog-db:
  appgog-keys:
  appgog-artifacts:
  appgog-uploads:
