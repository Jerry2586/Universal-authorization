name: appgog

x-app: &app
  image: ${APPGOG_IMAGE:-appgog-platform:local}
  build: .
  restart: unless-stopped
  init: true

services:
  initialize:
    <<: *app
    restart: "no"
    command: ["node", "scripts/docker/initialize.js"]
    env_file:
      - path: .env
        required: false
    environment:
      AUTH_DOMAIN: ${AUTH_DOMAIN:-}
      BUILD_DOMAIN: ${BUILD_DOMAIN:-}
    volumes:
      - appgog-db:/app/var/data
      - appgog-keys:/app/var/keys
      - appgog-artifacts:/app/var/artifacts
      - appgog-uploads:/app/var/uploads
      - appgog-license-config:/app/runtime/license
      - appgog-build-config:/app/runtime/build
      - appgog-worker-config:/app/runtime/worker
      - appgog-caddy-data:/app/runtime/caddy-data
      - appgog-caddy-config:/app/runtime/caddy-config

  license-center:
    <<: *app
    command: ["node", "apps/license-api/src/server.js"]
    depends_on:
      initialize:
        condition: service_completed_successfully
    environment:
      APPGOG_ENV_PATH: /app/runtime/license/runtime.env
    ports:
      - "${LICENSE_PORT:-127.0.0.1:8787}:8787"
    volumes:
      - appgog-db:/app/var/data
      - appgog-keys:/app/var/keys:ro
      - appgog-artifacts:/app/var/artifacts
      - appgog-uploads:/app/var/uploads
      - appgog-license-config:/app/runtime/license:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  build-center:
    <<: *app
    command: ["node", "apps/build-center/src/server.js"]
    depends_on:
      license-center:
        condition: service_healthy
    environment:
      APPGOG_ENV_PATH: /app/runtime/build/runtime.env
    ports:
      - "${BUILD_PORT:-127.0.0.1:8788}:8788"
    volumes:
      - appgog-build-config:/app/runtime/build:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  build-worker:
    <<: *app
    command: ["node", "apps/build-worker/src/server.js"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: "1.5"
    tmpfs:
      - /tmp:size=268435456,mode=1777
    depends_on:
      license-center:
        condition: service_healthy
    environment:
      APPGOG_ENV_PATH: /app/runtime/worker/runtime.env
    volumes:
      - appgog-worker-config:/app/runtime/worker:ro
      - appgog-artifacts:/app/var/artifacts

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      license-center:
        condition: service_healthy
      build-center:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - appgog-caddy-data:/data
      - appgog-caddy-config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  appgog-db:
  appgog-keys:
  appgog-artifacts:
  appgog-uploads:
  appgog-license-config:
  appgog-build-config:
  appgog-worker-config:
  appgog-caddy-data:
  appgog-caddy-config:
